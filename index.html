<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON PULSE // SNAKE</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #08080c;
            --panel-bg: #12121a;
            --border-col: #222233;
            --text-main: #e2e2ef;
            --accent-green: #00ffcc;
            --accent-blue: #00bfff;
            --accent-pink: #ff007f;
            --accent-orange: #ff9900;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            /* Hafif CRT tarama çizgisi dokusu */
            background-image: linear-gradient(rgba(18, 18, 26, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
        }

        .arcade-cabinet {
            position: relative;
            background: var(--panel-bg);
            border: 3px solid var(--border-col);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Başlık Alanı */
        .arcade-header {
            display: flex;
            justify-content: space-between;
            width: 480px;
            margin-bottom: 16px;
            align-items: flex-end;
            border-bottom: 2px dashed var(--border-col);
            padding-bottom: 12px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .logo span { color: var(--accent-green); font-family: 'VT323', monospace; font-size: 20px; }

        .stats-display {
            font-family: 'VT323', monospace;
            font-size: 24px;
            letter-spacing: 1px;
            color: var(--accent-blue);
        }

        /* Ekranlar (Menü / Oyun) */
        .screen-container {
            position: relative;
            width: 480px;
            height: 480px;
            background: #040406;
            border: 2px solid var(--border-col);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #050508;
        }

        /* Menü Katmanı */
        .overlay-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 8, 12, 0.92);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .overlay-menu.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .menu-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 0 15px var(--accent-green);
        }

        .setting-group {
            width: 100%;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8888a0;
        }

        .setting-options {
            display: flex;
            gap: 8px;
        }

        .option-btn {
            flex: 1;
            background: #1a1a24;
            border: 1px solid var(--border-col);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #555;
            background: #252535;
        }

        .option-btn.active {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0,255,204,0.4);
        }

        .start-action-btn {
            width: 100%;
            margin-top: 20px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(0,191,255,0.3);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .start-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,191,255,0.5);
        }

        .start-action-btn:active {
            transform: translateY(1px);
        }

        /* Game Over Paneli */
        #game-over-panel {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        #game-over-panel h2 {
            font-size: 36px;
            color: var(--accent-pink);
            font-family: 'VT323', monospace;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        #final-score {
            font-size: 20px;
            margin-bottom: 25px;
            color: #aaa;
        }

        .restart-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .restart-btn:hover { background: var(--accent-green); }

        /* Bildirim Toast */
        .toast {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-50px);
            background: rgba(0, 255, 204, 0.9);
            color: #000;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            pointer-events: none;
            z-index: 20;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="arcade-cabinet">
    <div class="arcade-header">
        <div class="logo">
            <h1 id="ui-brand">PULSE // SNAKE</h1>
            <span id="ui-subbrand">SYSTEM v1.2</span>
        </div>
        <div class="stats-display">
            <span id="score-display">0000</span>
        </div>
    </div>

    <div class="screen-container">
        <div id="toast" class="toast">LEVEL UP!</div>
        
        <!-- Oyun Alanı Canvas -->
        <canvas id="gameCanvas" width="480" height="480"></canvas>

        <!-- Özelleştirme Menüsü -->
        <div id="menu-overlay" class="overlay-menu">
            <div class="menu-title" id="menu-heading">SETTINGS</div>

            <!-- Renk Seçimi -->
            <div class="setting-group">
                <span class="setting-label" id="lbl-color">Yılan Rengi / Snake Color</span>
                <div class="setting-options">
                    <button class="option-btn active" onclick="setOpt('color', 0, this)">Neon Mint</button>
                    <button class="option-btn" onclick="setOpt('color', 1, this)">Cyber Blue</button>
                    <button class="option-btn" onclick="setOpt('color', 2, this)">Hot Pink</button>
                </div>
            </div>

            <!-- Harita Boyutu -->
            <div class="setting-group">
                <span class="setting-label" id="lbl-grid">Harita Boyutu / Grid Size</span>
                <div class="setting-options">
                    <button class="option-btn" onclick="setOpt('grid', 0, this)">Küçük (15x15)</button>
                    <button class="option-btn active" onclick="setOpt('grid', 1, this)">Orta (20x20)</button>
                    <button class="option-btn" onclick="setOpt('grid', 2, this)">Büyük (25x25)</button>
                </div>
            </div>

            <!-- Oyun Modu -->
            <div class="setting-group">
                <span class="setting-label" id="lbl-mode">Oyun Modu / Game Mode</span>
                <div class="setting-options">
                    <button class="option-btn active" onclick="setOpt('mode', 0, this)">Klasik</button>
                    <button class="option-btn" onclick="setOpt('mode', 1, this)">Duvar Geçme</button>
                </div>
            </div>

            <!-- Dil Seçimi -->
            <div class="setting-group">
                <span class="setting-label">Dil / Language</span>
                <div class="setting-options">
                    <button class="option-btn active" onclick="setLanguage('tr', this)">Türkçe</button>
                    <button class="option-btn" onclick="setLanguage('en', this)">English</button>
                </div>
            </div>

            <button class="start-action-btn" id="start-btn-text" onclick="initGame()">OYUNU BAŞLAT</button>
        </div>

        <!-- Game Over Ekranı -->
        <div id="game-over-panel">
            <h2 id="go-title">SİSTEM HATASI</h2>
            <div id="final-score">SKOR: 0</div>
            <button class="restart-btn" id="go-btn" onclick="returnToMenu()">MENÜYE DÖN</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Dil Veritabanı
    const langData = {
        tr: { heading: "AYARLAR", start: "OYUNU BAŞLAT", goTitle: "SİSTEM ÇÖKTÜ", scoreText: "SKOR:", restart: "TEKRAR DENE" },
        en: { heading: "SETTINGS", start: "START GAME", goTitle: "SYSTEM CRASH", scoreText: "SCORE:", restart: "TRY AGAIN" }
    };
    let currentLang = 'tr';

    // Seçenekler Durumu
    let gameSettings = {
        color: 0, // 0: Mint, 1: Blue, 2: Pink
        grid: 1,  // 0: 15, 1: 20, 2: 25
        mode: 0   // 0: Klasik, 1: Duvar Geçme
    };

    const colorPalettes = [
        { head: "#00ffcc", body: "#00b38f", glow: "rgba(0,255,204,0.4)" },
        { head: "#00bfff", body: "#0080ff", glow: "rgba(0,191,255,0.4)" },
        { head: "#ff007f", body: "#b30059", glow: "rgba(255,0,127,0.4)" }
    ];

    const gridSizes = [15, 20, 25];

    function setOpt(type, val, btnElem) {
        gameSettings[type] = val;
        // Aynı gruptaki butonların active sınıfını kaldır
        let parent = btnElem.parentElement;
        Array.from(parent.children).forEach(child => child.classList.remove('active'));
        btnElem.classList.add('active');
    }

    function setLanguage(lang, btnElem) {
        currentLang = lang;
        let parent = btnElem.parentElement;
        Array.from(parent.children).forEach(child => child.classList.remove('active'));
        btnElem.classList.add('active');

        // Arayüz metinlerini güncelle
        let t = langData[currentLang];
        document.getElementById("menu-heading").innerText = t.heading;
        document.getElementById("start-btn-text").innerText = t.start;
        document.getElementById("go-title").innerText = t.goTitle;
        document.getElementById("go-btn").innerText = t.restart;
    }

    // Oyun Değişkenleri
    let snake, dx, dy, nextDx, nextDy, food, score, gameInterval, gridSize, blockSize;
    let isPlaying = false;

    function initGame() {
        document.getElementById("menu-overlay").classList.add("hidden");
        document.getElementById("game-over-panel").style.display = "none";

        gridSize = gridSizes[gameSettings.grid];
        blockSize = 480 / gridSize;

        snake = [
            { x: Math.floor(gridSize / 2), y: Math.floor(gridSize / 2) },
            { x: Math.floor(gridSize / 2) - 1, y: Math.floor(gridSize / 2) }
        ];
        dx = 1; dy = 0;
        nextDx = 1; nextDy = 0;
        score = 0;
        updateScoreDisplay();
        spawnFood();

        isPlaying = true;
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 110);
    }

    function spawnFood() {
        food = {
            x: Math.floor(Math.random() * gridSize),
            y: Math.floor(Math.random() * gridSize)
        };
        snake.forEach(part => {
            if (part.x === food.x && part.y === food.y) spawnFood();
        });
    }

    window.addEventListener("keydown", e => {
        if (!isPlaying) return;
        if ((e.key === "ArrowUp" || e.key === "w" || e.key === "W") && dy === 0) { nextDx = 0; nextDy = -1; e.preventDefault(); }
        if ((e.key === "ArrowDown" || e.key === "s" || e.key === "S") && dy === 0) { nextDx = 0; nextDy = 1; e.preventDefault(); }
        if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && dx === 0) { nextDx = -1; nextDy = 0; e.preventDefault(); }
        if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && dx === 0) { nextDx = 1; nextDy = 0; e.preventDefault(); }
    });

    function gameLoop() {
        dx = nextDx; dy = nextDy;
        let head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // Duvar Kontrolleri
        if (gameSettings.mode === 0) { // Klasik
            if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                triggerGameOver();
                return;
            }
        } else { // Duvar Geçme
            head.x = (head.x + gridSize) % gridSize;
            head.y = (head.y + gridSize) % gridSize;
        }

        // Kendi Kendine Çarpma
        for (let part of snake) {
            if (head.x === part.x && head.y === part.y) {
                triggerGameOver();
                return;
            }
        }

        snake.unshift(head);

        // Yem Kontrolü
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            updateScoreDisplay();
            showToast("+10 BONUS");
            spawnFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        ctx.fillStyle = "#050508";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Hafif Izgara Çizgileri
        ctx.strokeStyle = "#101018";
        ctx.lineWidth = 1;
        for (let i = 0; i < gridSize; i++) {
            ctx.beginPath();
            ctx.moveTo(i * blockSize, 0);
            ctx.lineTo(i * blockSize, 480);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * blockSize);
            ctx.lineTo(480, i * blockSize);
            ctx.stroke();
        }

        let palette = colorPalettes[gameSettings.color];

        // Yemi Çiz (Parlak neon nokta)
        ctx.shadowColor = "#ff0055";
        ctx.shadowBlur = 12;
        ctx.fillStyle = "#ff0055";
        ctx.beginPath();
        let fx = food.x * blockSize + blockSize / 2;
        let fy = food.y * blockSize + blockSize / 2;
        ctx.arc(fx, fy, blockSize / 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0; // Gölgeyi sıfırla

        // Yılanı Çiz
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? palette.head : palette.body;
            let rx = part.x * blockSize + 1;
            let ry = part.y * blockSize + 1;
            let rw = blockSize - 2;
            let rh = blockSize - 2;
            
            // Yuvarlatılmış yumuşak bloklar
            ctx.beginPath();
            ctx.roundRect(rx, ry, rw, rh, 4);
            ctx.fill();
        });
    }

    function updateScoreDisplay() {
        document.getElementById("score-display").innerText = String(score).padStart(4, '0');
    }

    function showToast(text) {
        let toast = document.getElementById("toast");
        toast.innerText = text;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 800);
    }

    function triggerGameOver() {
        isPlaying = false;
        clearInterval(gameInterval);
        document.getElementById("final-score").innerText = `${langData[currentLang].scoreText} ${score}`;
        document.getElementById("game-over-panel").style.display = "flex";
    }

    function returnToMenu() {
        document.getElementById("game-over-panel").style.display = "none";
        document.getElementById("menu-overlay").classList.remove("hidden");
    }
</script>
</body>
</html>
