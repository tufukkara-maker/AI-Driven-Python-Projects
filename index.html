<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSE // SNAKE REMIXED</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060609;
            --panel-bg: #101018;
            --border-col: #1e1e2f;
            --text-main: #e2e2ef;
            --accent-green: #00ffcc;
            --accent-blue: #00bfff;
            --accent-pink: #ff007f;
            --accent-orange: #ff9900;
            --accent-purple: #bf00ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: linear-gradient(rgba(12, 12, 20, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
        }

        .arcade-cabinet {
            position: relative;
            background: var(--panel-bg);
            border: 3px solid var(--border-col);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .arcade-header {
            display: flex;
            justify-content: space-between;
            width: 500px;
            margin-bottom: 16px;
            align-items: flex-end;
            border-bottom: 2px dashed var(--border-col);
            padding-bottom: 12px;
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .logo span { color: var(--accent-green); font-family: 'VT323', monospace; font-size: 18px; }

        .stats-display {
            font-family: 'VT323', monospace;
            font-size: 26px;
            letter-spacing: 1px;
            color: var(--accent-blue);
        }

        .screen-container {
            position: relative;
            width: 500px;
            height: 500px;
            background: #040406;
            border: 2px solid var(--border-col);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #040406;
        }

        /* Menü Katmanı */
        .overlay-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 6, 9, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .overlay-menu.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .menu-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 15px var(--accent-green);
        }

        .setting-group {
            width: 100%;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .setting-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8888a0;
        }

        .setting-options {
            display: flex;
            gap: 6px;
        }

        .option-btn {
            flex: 1;
            background: #151520;
            border: 1px solid var(--border-col);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover { border-color: #555; background: #202030; }
        .option-btn.active {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0,255,204,0.3);
        }

        .start-action-btn {
            width: 100%;
            margin-top: 15px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(0,191,255,0.3);
            transition: transform 0.1s;
        }
        .start-action-btn:hover { transform: translateY(-2px); }

        /* Game Over Paneli */
        #game-over-panel {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        #game-over-panel h2 {
            font-size: 34px;
            color: var(--accent-pink);
            font-family: 'VT323', monospace;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        #final-score { font-size: 18px; margin-bottom: 20px; color: #aaa; }

        .gameover-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: #fff; color: #000; border: none;
            padding: 10px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
        }
        .action-btn:hover { background: var(--accent-green); }
        .action-btn.secondary { background: #222233; color: #fff; border: 1px solid #444; }
        .action-btn.secondary:hover { background: #33334d; }

        /* Bildirim Toast */
        .toast {
            position: absolute;
            top: 15px; left: 50%;
            transform: translateX(-50%) translateY(-40px);
            background: rgba(0, 255, 204, 0.95);
            color: #000; padding: 5px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 700; opacity: 0;
            transition: transform 0.3s, opacity 0.3s; pointer-events: none; z-index: 20;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div class="arcade-cabinet">
    <div class="arcade-header">
        <div class="logo">
            <h1>PULSE // SNAKE</h1>
            <span>REMIXED EDITION</span>
        </div>
        <div class="stats-display">
            <span id="score-display">0000</span>
        </div>
    </div>

    <div class="screen-container">
        <div id="toast" class="toast">EFFECT ACTIVATED</div>
        <canvas id="gameCanvas" width="500" height="500"></canvas>

        <!-- Menü -->
        <div id="menu-overlay" class="overlay-menu">
            <div class="menu-title">CONFIGURATION</div>

            <div class="setting-group">
                <span class="setting-label">Snake Color</span>
                <div class="setting-options">
                    <button class="option-btn active" onclick="setOpt('color', 0, this)">Neon Mint</button>
                    <button class="option-btn" onclick="setOpt('color', 1, this)">Cyber Blue</button>
                    <button class="option-btn" onclick="setOpt('color', 2, this)">Hot Pink</button>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">Game Mode</span>
                <div class="setting-options">
                    <button class="option-btn active" onclick="setOpt('mode', 'classic', this)">Classic</button>
                    <button class="option-btn" onclick="setOpt('mode', 'shrinking', this)">Shrinking</button>
                    <button class="option-btn" onclick="setOpt('mode', 'combat', this)">Combat</button>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">Movement Physics</span>
                <div class="setting-options">
                    <button class="option-btn active" onclick="setOpt('physics', 'grid', this)">Grid Snap</button>
                    <button class="option-btn" onclick="setOpt('physics', 'fluid', this)">Fluid Wave</button>
                </div>
            </div>

            <button class="start-action-btn" onclick="initGame()">INITIALIZE SYSTEM</button>
        </div>

        <!-- Game Over Ekranı -->
        <div id="game-over-panel">
            <h2>SYSTEM CRASHED</h2>
            <div id="final-score">SCORE: 0</div>
            <div class="gameover-buttons">
                <button class="action-btn" onclick="initGame()">RESTART</button>
                <button class="action-btn secondary" onclick="returnToMenu()">MAIN MENU</button>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let settings = { color: 0, mode: 'classic', physics: 'grid' };
    const palettes = [
        { head: "#00ffcc", body: "#00b38f" },
        { head: "#00bfff", body: "#0080ff" },
        { head: "#ff007f", body: "#b30059" }
    ];

    function setOpt(type, val, btn) {
        settings[type] = val;
        Array.from(btn.parentElement.children).forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
    }

    let snake = [], dx = 1, dy = 0, nextDx = 1, nextDy = 0;
    let food = {}, enemies = [];
    let score = 0, gameInterval, isPlaying = false;
    let gridSize = 20, blockSize = 25;
    let borderShrinkTimer = 0, activeShrink = 0;
    let matrixChanceUsed = false;

    function initGame() {
        document.getElementById("menu-overlay").classList.add("hidden");
        document.getElementById("game-over-panel").style.display = "none";

        snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
        dx = 1; dy = 0; nextDx = 1; nextDy = 0;
        score = 0; activeShrink = 0; borderShrinkTimer = 0;
        matrixChanceUsed = false;
        updateScore();
        spawnFood();
        enemies = [];

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 100);
        isPlaying = true;
    }

    function spawnFood() {
        food = {
            x: Math.floor(Math.random() * (gridSize - activeShrink * 2)) + activeShrink,
            y: Math.floor(Math.random() * (gridSize - activeShrink * 2)) + activeShrink,
            type: Math.random() < 0.2 ? 'special' : 'normal'
        };
    }

    window.addEventListener("keydown", e => {
        if (!isPlaying) return;
        if ((e.key === "ArrowUp" || e.key === "w") && dy === 0) { nextDx = 0; nextDy = -1; e.preventDefault(); }
        if ((e.key === "ArrowDown" || e.key === "s") && dy === 0) { nextDx = 0; nextDy = 1; e.preventDefault(); }
        if ((e.key === "ArrowLeft" || e.key === "a") && dx === 0) { nextDx = -1; nextDy = 0; e.preventDefault(); }
        if ((e.key === "ArrowRight" || e.key === "d") && dx === 0) { nextDx = 1; nextDy = 0; e.preventDefault(); }
    });

    function gameLoop() {
        dx = nextDx; dy = nextDy;
        let head = { x: snake[0].x + dx, y: snake[0].y + dy };

        let minLimit = activeShrink;
        let maxLimit = gridSize - 1 - activeShrink;

        if (settings.mode === 'classic' || settings.mode === 'shrinking' || settings.mode === 'combat') {
            if (head.x < minLimit || head.x > maxLimit || head.y < minLimit || head.y > maxLimit) {
                if (tryMatrixSave()) return;
                triggerGameOver();
                return;
            }
        }

        for (let part of snake) {
            if (head.x === part.x && head.y === part.y) {
                if (tryMatrixSave()) return;
                triggerGameOver();
                return;
            }
        }

        // Düşman Çarpışma Kontrolü (Düşman sana değerse ölürsün)
        for (let en of enemies) {
            if (head.x === en.x && head.y === en.y) {
                if (tryMatrixSave()) return;
                triggerGameOver();
                return;
            }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += food.type === 'special' ? 30 : 10;
            if (food.type === 'special') applyMetabolismEffect();
            updateScore();
            spawnFood();
        } else {
            snake.pop();
        }

        if (settings.mode === 'shrinking') {
            borderShrinkTimer++;
            if (borderShrinkTimer > 35 && activeShrink < 4) {
                activeShrink++;
                borderShrinkTimer = 0;
                showToast("ARENA SHRANK!");
            }
        }

        // Combat Modunda Akıllı Düşman Üretimi ve Takip Mantığı
        if (settings.mode === 'combat') {
            if (Math.randomStr = Math.random() < 0.1 && enemies.length < 3) {
                enemies.push({
                    x: Math.random() < 0.5 ? activeShrink : maxLimit,
                    y: Math.floor(Math.random() * gridSize)
                });
            }

            // Düşmanlar yılanın kafasına doğru yavaşça hareket eder
            enemies.forEach(en => {
                if (en.x < snake[0].x) en.x++;
                else if (en.x > snake[0].x) en.x--;
                
                if (en.y < snake[0].y) en.y++;
                else if (en.y > snake[0].y) en.y--;
            });
        }

        // Düşmanın kendi kuyruğuna çarpıp yok olması
        enemies.forEach((en, idx) => {
            snake.forEach(part => {
                if (en.x === part.x && en.y === part.y) {
                    enemies.splice(idx, 1);
                    score += 50;
                    updateScore();
                    showToast("ENEMY DESTROYED BY TAIL!");
                }
            });
        });

        draw();
    }

    function tryMatrixSave() {
        if (!matrixChanceUsed && Math.random() < 0.15) {
            matrixChanceUsed = true;
            showToast("CRITICAL SAVE! MATRIX ACTIVE");
            const safeDirs = [{x:0, y:-1}, {x:0, y:1}, {x:-1, y:0}, {x:1, y:0}];
            for (let d of safeDirs) {
                let testHead = { x: snake[0].x + d.x, y: snake[0].y + d.y };
                if (testHead.x >= 0 && testHead.x < gridSize && testHead.y >= 0 && testHead.y < gridSize) {
                    dx = d.x; dy = d.y;
                    nextDx = d.x; nextDy = d.y;
                    snake.unshift(testHead);
                    snake.pop();
                    return true;
                }
            }
        }
        return false;
    }

    function applyMetabolismEffect() {
        const effects = ["SPEED BOOST", "BODY SHRINK", "BONUS POINTS"];
        let choice = effects[Math.floor(Math.random() * effects.length)];
        showToast(choice);
        if (choice === "BODY SHRINK" && snake.length > 3) {
            snake.pop();
            snake.pop();
        }
    }

    function showToast(text) {
        let t = document.getElementById("toast");
        t.innerText = text; t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 1000);
    }

    function updateScore() {
        document.getElementById("score-display").innerText = String(score).padStart(4, '0');
    }

    function draw() {
        ctx.fillStyle = "#040406";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (activeShrink > 0) {
            ctx.strokeStyle = "rgba(255,0,127,0.4)";
            ctx.lineWidth = 2;
            ctx.strokeRect(activeShrink * blockSize, activeShrink * blockSize, (gridSize - activeShrink * 2) * blockSize, (gridSize - activeShrink * 2) * blockSize);
        }

        // Yem Çizimi
        ctx.fillStyle = food.type === 'special' ? '#ff9900' : '#ff0055';
        ctx.fillRect(food.x * blockSize + 2, food.y * blockSize + 2, blockSize - 4, blockSize - 4);

        // Takip Eden Düşmanlar (Parlak Neon Mor)
        ctx.shadowColor = "#bf00ff";
        ctx.shadowBlur = 12;
        ctx.fillStyle = "#bf00ff";
        enemies.forEach(en => {
            ctx.fillRect(en.x * blockSize + 2, en.y * blockSize + 2, blockSize - 4, blockSize - 4);
        });
        ctx.shadowBlur = 0;

        let palette = palettes[settings.color];
        if (settings.physics === 'fluid') {
            ctx.strokeStyle = palette.head;
            ctx.lineWidth = blockSize - 6;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();
            snake.forEach((pt, i) => {
                let px = pt.x * blockSize + blockSize / 2;
                let py = pt.y * blockSize + blockSize / 2;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            });
            ctx.stroke();
        } else {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? palette.head : palette.body;
                ctx.fillRect(part.x * blockSize + 1, part.y * blockSize + 1, blockSize - 2, blockSize - 2);
            });
        }
    }

    function triggerGameOver() {
        isPlaying = false;
        clearInterval(gameInterval);
        document.getElementById("final-score").innerText = `SCORE: ${score}`;
        document.getElementById("game-over-panel").style.display = "flex";
    }

    function returnToMenu() {
        document.getElementById("game-over-panel").style.display = "none";
        document.getElementById("menu-overlay").classList.remove("hidden");
    }
</script>
</body>
</html>
